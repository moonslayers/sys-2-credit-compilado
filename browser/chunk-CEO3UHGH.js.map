<div class="container-xl my-2 p-3 rounded shadow bg-white">
  <h4><i class="bi bi-money fs-4"></i> Consolidado de cobranza </h4>
  <app-progress-bar-consolidado
    title="Preparación de datos para el consolidado de cobranza" [isLoading]="isLoading"
    [progress]="progress" [dataLen]="dataSource.length"
    ></app-progress-bar-consolidado>
    <app-dates-picker [isLoading]="isLoading" [filtros]="options" (download)="fetchData()"></app-dates-picker>
  <app-informe-tabla-dinamica-local [data]="dataSource" [clusterColumns]="columnsClusters" fileName="informe_cobranza"></app-informe-tabla-dinamica-local>
</div>
