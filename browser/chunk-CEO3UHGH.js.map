<div class="container-fluid p-3 mt-1">
    <h4>Generacion de informe buró de crédito</h4>
    <div class="container-fluid p-3 rounded shadow bg-white mb-3">
        <app-progress-bar-consolidado title="Preparación de datos para el reporte de buró de crédito"
            [isLoading]="isLoading" [progress]="progress" [dataLen]="dataSource.length"></app-progress-bar-consolidado>
        <app-dates-picker [isLoading]="isLoading" [filtros]="options" (download)="fetchData()" (downloadExcel)="descargarExcel()"></app-dates-picker>
    </div>
    @if (dataSource.length) {
    <app-buro-encabezado (encabezadoConfirmado)="descargarInformeTxt($event)"></app-buro-encabezado>
    }
</div>
