<div class="container-xxl p-3 bg-white rounded shadow">
    <h4 class="p-3 ">Documentos Digitalizados:</h4>
    <app-buscador-creditos [justId]="true" [(creditoId)]="creditoId" (creditoIdChange)="updateUrl()"></app-buscador-creditos>
    <app-contratos [creditoId]="creditoId"></app-contratos>
    <app-documentos-s2c [creditoId]="creditoId"></app-documentos-s2c>
    <app-documentos [credito]="credito"></app-documentos>
    <app-documentos-s2c title="Documentos Solicitud Migrados" tipo="SOLICITUD" [creditoId]="creditoId"></app-documentos-s2c>
</div>
