@if (creditoId()) {
    <div class="container-fluid p-3">
    <div class="card">
        <div class="card-header text-bg-secondary">
            Contratos:
        </div>
        <div class="card-body">
            @if(documentos.length){
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Nombre</th>
                            <th>Tipo</th>
                            <th>Subido Por</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (doc of documentos; track doc.id) {
                        <tr>
                            <td class="fw-medium">{{ doc.documento_url }}</td>
                            <td><span class="badge bg-primary">{{ doc.tipo }}</span></td>
                            <td>{{ doc.usuarios?.nombre }}</td>
                            <td class="text-end">
                                <a class="btn btn-sm btn-outline-secondary"
                                    [href]="utils.fileUrlInLineSanatized(doc.documento_url)" target="_blank"
                                    rel="noopener noreferrer" title="Descargar documento">
                                    <i class="bi bi-download"></i>
                                </a>
                            </td>
                        </tr>
                        }
                    </tbody>
                </table>
            </div>
            }@else {
            <p class="text-center text-muted h5">
                No hay documentos digitalizados en el sistema nuevo para este crédito.
            </p>
            }
        </div>
    </div>
</div>
}
