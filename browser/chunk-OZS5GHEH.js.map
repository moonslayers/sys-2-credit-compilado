@if (!menu_option.sub_menu) {
@if (hasPermiso(menu_option.permiso)) {
<a [routerLink]="menu_option.router_link" [class.tooltip-container]="menu_option.tooltip"
  class="list-group-item list-group-item-action text-light border-none bold-over text-nowrap" [class]="classColor"
  [class.text-bold]="isOptionInRoute()">
  @if (icon()) {
  <i class="bi " [ngClass]="[icon_size,icon()]"></i>
  }
  <span class="p-2 pb-5 animate__animated animate__faster" [class]="label_size">
    {{menu_option.label}}
  </span>
  <div class="tooltip-text z-5">{{menu_option.tooltip}}</div>
</a>
}
} @else {
<a class="list-group-item list-group-item-action bg-primary text-light border-none bold-over pointer"
  [class.text-bold]="isOptionInRoute()" data-bs-toggle="collapse" (click)="collapse()" aria-controls="collapseExample">
  <i class="bi" [ngClass]="[icon_size,icon()]"></i>
  <span class="p-2 pb-5 animate__animated animate__faster" [class]="label_size">
    {{menu_option.label}}
  </span>
</a>
<div class="container animate-speed p-0 animate__animated" [ngClass]="subMenuExpandClass">
  @for (option of menu_option.sub_menu; track option) {
  @if (hasPermiso(option.permiso)) {
  <app-menu-option [menu_option]="option" [menuExpanded]="menuExpanded" classColor="bg-secondary"
    [label_size]="label_size" [icon_size]="icon_size"></app-menu-option>
  }
  }
</div>
}
