<div class="container-fluid border rounded">
  <div class="row">
    @if (edit) {
      @for (field of fields; track field) {
        <div class="col-12 col-sm p-3">
          <app-form-field [field]="field" />
        </div>
      }
    }
    @if (!edit) {
      <div class="col-12 col-sm p-3">
        {{documento.documentos?.nombre}}
      </div>
      <div class="col-12 col-sm p-3">
        {{documento.prioridad}}
      </div>
    }
    <div class="col-12 col-sm p-3 text-nowrap align-self-center text-end">
      @if (!edit) {
        <button class="btn btn-primary mx-1" (click)="edit=true">
          <i class="bi bi-pencil-fill"></i>
        </button>
      }
      @if (edit) {
        <button class="btn btn-primary mx-1" (click)="save()">
          @if (isLoading) {
            <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
          }
          @if (!isLoading) {
            <i class="bi bi-floppy-fill"></i>
          }
        </button>
      }
      <button class="btn btn-danger mx-1" (click)="delete()">
        @if (isDeleting) {
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        }
        @if (!isDeleting) {
          <i class="bi bi-trash-fill"></i>
        }
      </button>
    </div>
  </div>
</div>
