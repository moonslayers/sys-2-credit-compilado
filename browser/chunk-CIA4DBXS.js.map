
@if (!amortizaciones) {
  <div [class]="div" class="mt-4">
    <h3 class="text-center"><b>Cotizador Express</b></h3>
    <div class="row">
      <div class="col-12 col-sm-6 col-md-4 col-lg">
        <div class="form-group">
          <label class="fw-bold" for="capital">Capital</label>
          <input type="number" class="form-control" id="capital" [(ngModel)]="data.capital" name="capital" min="0">
        </div>
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg">
        <div class="form-group">
          <label class="fw-bold" for="interesAnual">Interés Anual (0-100)%</label>
          <input type="number" class="form-control" id="interesAnual" [(ngModel)]="data.interes_anual"
            name="interesAnual" min="0">
        </div>
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg">
        <div class="form-group">
          <label class="fw-bold" for="incluirIva">Incluir IVA</label>
          <select class="form-select" id="incluirIva" [(ngModel)]="data.incluir_iva" name="incluirIva">
            <option [value]="true">Sí</option>
            <option [value]="false">No</option>
          </select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-12 col-sm-6 col-md-4 col-lg">
        <div class="form-group">
          <label class="fw-bold" for="gastosJudiciales">Gasto de cobranza</label>
          <input type="number" class="form-control" id="gastosJudiciales" [(ngModel)]="data.gastos_judiciales"
            name="gastosJudiciales" min="0">
        </div>
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg">
        <div class="form-group">
          <label class="fw-bold" for="plazos">Plazos</label>
          <input type="number" class="form-control" id="plazos" [(ngModel)]="data.plazos" name="plazos" min="1">
        </div>
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg">
        <div class="form-group">
          <label class="fw-bold" for="plazo_tipo">Tipo de Plazo</label>
          <select class="form-control" id="plazo_tipo" [(ngModel)]="data.plazo_tipo" name="plazo_tipo">
            <option value="MENSUAL">Mensual</option>
            <option value="SEMANAL">Semanal</option>
          </select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-12 col-sm-6 col-md-4 col-lg">
        <div class="form-group">
          <label class="fw-bold" for="fechaInicio">Fecha de Inicio</label>
          <input type="date" class="form-control" id="fechaInicio" [(ngModel)]="data.fecha_inicio" name="fechaInicio">
        </div>
      </div>
    </div>
    <div class="form-group">
      <label class="fw-bold" for="tipoTasa">Tipo de Tasa</label>
      <select class="form-control" id="tipoTasa" [(ngModel)]="data.tipo_tasa" name="tipoTasa">
        <option value="TASA ORDINARIA ANUAL">Tasa Ordinaria Anual</option>
        <option value="TASA INSOLUTA">Tasa Insoluta</option>
      </select>
    </div>
    <div class="row mt-3">
      <div class="col text-center">
        <button class="btn btn-primary" (click)="getAmortizaciones()">
          Cotizar Amortizaciones
        </button>
      </div>
    </div>
  </div>
}
<app-amortizaciones [div]="div" [(amortizaciones)]="amortizaciones" [data]="data"  />
