<div class="container my-1 p-3 bg-white rounded shadow">
  <h4 class="mb-2"><b>{{edit?'Editar':'Nueva'}} sesión</b></h4>
  <hr class="border border-primary">
  <div class="row">
    <div class="col-12 col-sm-6 col-md p-3">
      <label><b>No. Sesión:</b></label>
      <input class="form-control" type="text" placeholder="No de sesión" [(ngModel)]="new.sesion">
    </div>
    <div class="col-12 col-sm-6 col-md p-3">
      <label><b>Tipo de Sesión:</b></label>
      <select class="form-select" [(ngModel)]="new.tipo_sesion">
        <option [value]="undefined" disabled>Selecciona una opción</option>
        <option>ORDINARIA</option>
        <option>EXTRAORDINARIA</option>
      </select>
    </div>
    <div class="col-12 col-sm p-3">
      <label><b>Fecha de Sesión:</b></label>
      <input class="form-control" type="date" placeholder="No de sesión" [(ngModel)]="new.fecha">
    </div>
  </div>
  @if (edit) {
    <div class="row mt-4">
      <div class="col"><h4><b>Documentos de sesión</b></h4></div>
      <div class="col-auto">
        <button class="btn btn-success btn-sm" (click)="addDocumento()">
          <i class="bi bi-plus-circle-fill"></i>
        </button>
      </div>
    </div>
    <hr class="border border-primary mt-0">
    @if (edit.sesiones_documentos?.length===0) {
      <p class="p-3">
        No hay documentos registrados
      </p>
    }
    @for (doc of edit.sesiones_documentos; track doc) {
      <app-form-sesion-documento
        [sesion_id]="edit.id"
        [edit]="doc"
        (deleted)="onDocDeleted(doc)"
        />
    }
  }

  <div class="row px-3 mt-2 mb-2">
    <div class="col text-center">
      <button class="btn btn-primary" (click)="submit()">
        Guardar Sesión
      </button>
    </div>
  </div>
</div>
