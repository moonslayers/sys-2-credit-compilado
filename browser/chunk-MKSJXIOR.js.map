<div class="row py-2">
  <div class="input-group">
    <span class="input-group-text">Tipo Documento</span>
    <select class="form-select" [(ngModel)]="edit.tipo_documento">
      <option [value]="undefined" disabled>Selecciona un tipo de documento</option>
      <option >MINUTA</option>
      <option >ACUERDO</option>
      <option >OTRO</option>
    </select>
    @if (edit.archivo_url) {
      <span class="input-group-text">Archivo Subido</span>
    }
    @if (edit.archivo_url) {
      <a class="btn btn-outline-secondary"
        [href]="utils.fileUrlInLine(edit.archivo_url)">
        <i class="bi bi-download"></i>
      </a>
    }
    <input placeholder="Documento..." class="form-control" type="file" accept=".pdf" (change)="appendFile($event)">
  </div>
  <div class="input-group mt-1">
    <span class="input-group-text">Comentario</span>
    <textarea class="form-control" aria-label="With textarea" placeholder="Ingrese un comentario..." [(ngModel)]="edit.comentario"></textarea>
    <button class="btn btn-secondary" (click)="submit()">
      <i class="bi bi-floppy-fill"></i>
    </button>
    <button class="btn btn-danger" (click)="delete()">
      <i class="bi bi-trash-fill"></i>
    </button>
  </div>
</div>
