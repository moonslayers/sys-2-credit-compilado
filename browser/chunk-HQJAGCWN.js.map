<div class="container-fluid p-3">
  <div class="row">
    <div class="col-12">
      <p class="h2 text-light fw-bold mt-5">Selecciona un perfil:</p>
      <select class="form-select form-select-lg mt-3 shadow" [(ngModel)]="perfilSelected">
        <option [value]="undefined" disabled selected>Selecciona una opcion</option>
        @for (perfil of usuarioLogin.perfiles; track perfil) {
          <option [value]="perfil.id">
            {{perfil.sucursales.nombre}} ({{perfil.tipos_usuarios.nombre}})
          </option>
        }
      </select>
    </div>
    <div class="col-12 text-center mt-5">
      <button class="btn btn-secondary btn-lg" (click)="onSelected()" [disabled]="!perfilSelected">
        Entrar
      </button>
    </div>
  </div>
</div>
