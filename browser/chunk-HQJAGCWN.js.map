<h2 class="text-secondary fw-bold m-4 pt-4">Reiniciar contraseña</h2>
<div class="row mt-5 p-2 pb-3">
    <div class="col-12">
        <div class="form-floating has-validation">
            <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com"
            [(ngModel)]="correo" #correoInput="ngModel" required email
            [class.is-invalid]="correoInput.touched && correoInput.invalid">
            <label for="floatingInput">Correo electronico</label>
            <div id="floatingInputFeedback" class="invalid-feedback text-light fw-bold">
                Ingresa un correo electronico válido.
            </div> 
        </div>
    </div>
    <div class="col-12 mt-3 text-center">
        <button class="btn btn-secondary">
            Enviar link de recuperación.
        </button>
    </div>
</div>
