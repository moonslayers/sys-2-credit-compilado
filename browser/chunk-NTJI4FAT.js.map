<div class="container main">
  @if (solicitudApoyoModalidades.length===0) {
    <p class="p-5 text-center">
      <span class="h3">No hay modalidades o ministraciones en proceso</span>
    </p>
  }
  @for (modalidad of solicitudApoyoModalidades; track modalidad) {
    <app-form-solicitud-modalidad [solicitudApoyoModalidad]="modalidad"
      (onDeleted)="utils.localDelete(solicitudApoyoModalidades,modalidad)"
      (onSaved)="isSomeEditing=false"
      />
  }
  @if (!isSomeEditing) {
    <div class="row justify-content-center mt-5">
      <button class="btn btn-success col-auto" (click)="agregarModalidad()" [disabled]="someModalidadIsActive()">
        <i class="bi bi-plus-circle-fill px-2 fw-bold">
          @if (solicitudApoyoModalidades.length===0) {
            <span>Agregar Modalidad</span>
          }
          @if (solicitudApoyoModalidades.length>0) {
            <span>Agregar Ministración</span>
          }
        </i>
      </button>
    </div>
  }
</div>
