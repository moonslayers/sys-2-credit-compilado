<div class="container position-relative">
    <div class="row justify-content-end sticky-top">
        <div class="col-auto p-1">
            <button class="btn btn-primary" (click)="autoLlenarDomicilio()">
                Auto Llenar Domicilio
            </button>
        </div>
        <div class="col-auto p-1">
            <button class="btn btn-primary" (click)="autoLlenarDomcilioFiscal()">
                Auto Llenar Domicilio Fiscal
            </button>
        </div>
    </div>
    <app-generic-form
    [form]="form"
    [controller]="solicitudApoyoController"
    [(edit)]="edit"
    [editFill]="editFill"
    [validator]="{required:true}"
    rowButtonClass="row pt-3 pb-0 bg-white sticky-bottom z-2" 
    />
</div>
