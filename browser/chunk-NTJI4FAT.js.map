@for (modalidad of solicitudApoyo?.solicitudes_apoyos_modalidades; track modalidad) {
  <div class="container mt-2" >
    <b>Documentos Variados:</b>
    <div class="row justify-content-center mb-2">
      <div class="col-auto">
        <button class="btn btn-outline-primary" (click)="cartaCompromiso.generarCartaCompromiso(solicitudApoyo)">
          <i class="bi bi-printer">Carta Compromiso</i>
        </button>
      </div>
    </div>
    <form-group
      [title]="modalidadDocumentoTitle(modalidad)"
      >
      <div class="container pt-2 pb-3">
        @for (modalidadDocumento of modalidad.solicitudes_apoyos_modalidades_documentos; track modalidadDocumento) {
          <app-form-modalidad-documento [record]="modalidadDocumento"  />
        }
      </div>
    </form-group>
  </div>
}
