<div class="container rounded p-3 border my-1">
  <div class="row">
    @if (!edit) {
      <div class="col-12 col-sm px-3 text-uppercase" >{{record.nombre}}</div>
      <div class="col-12 col-sm px-3" >{{record.monto_solicitado|currency}}</div>
    }
    @if (edit) {
      <div class="col-12 col-sm">
        <app-simple-field
          type="text"
          placeholder="Descripcion del detalle..."
          [(value)]="record.nombre"
          [validator]="{required:true}"
          />
      </div>
      <div class="col-12 col-sm">
        <app-simple-field
          type="number"
          placeholder="Monto $..."
          [(value)]="record.monto_solicitado"
          [validator]="{required:true, min:0}"
          />
      </div>
    }
    <div class="col-12 col-sm text-end align-self-end">
      <record-form-buttons [(edit)]="edit" (editChange)="onEditing.emit()" [isDeleting]="isDeleting" [isLoading]="isLoading" (onSaveButtonClick)="save()" (onDeleteButtonClick)="delete()" />
    </div>
  </div>
</div>
