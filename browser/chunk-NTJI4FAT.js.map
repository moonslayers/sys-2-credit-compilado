@if (record.modalidades_ministraciones_documentos?.documentos?.nombre) {
  <div class="container rounded border p-3 mb-2">
    <div class="row h5 text-uppercase">
      <div class="col-12 col-sm">
        {{record.modalidades_ministraciones_documentos?.documentos?.nombre}}
      </div>
      <div class="col-11 col-sm">
        <app-file-input
          apiUrl="api/files/apoyos/modalidad/modalidad/save"
          [formExtra]="{id: record.id}"
          [(url)]="record.url"
          [showSimpleDownload]="true"
          key="document"
          />
      </div>
      @if (record.url) {
        <div class="col-auto">
          <i class="bi bi-check-circle-fill text-success fs-4"></i>
        </div>
      }
    </div>
  </div>
}
