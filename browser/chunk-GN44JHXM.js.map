<div class="form-floating">
    <input #inputNombre type="text" class="form-control" id="flotingSearchInput"
        placeholder="Ingresa un nombre para buscar" (focus)="showAutoCompleteList()" (input)="buscar()"
        (keyup.enter)="buscar(true)" [(ngModel)]="valueInput" (keyup)="showAutoComplete=true">
    <label for="flotingSearchInput">Ingresa un nombre para buscar...</label>
</div>
@if (showAutoComplete) {
<div class="container-fluid p-0 position-absolute">
    <div class="container-fluid position-relative">
        <div class="container-fluid bg-white position-absoute top-0 shadow rounded p-3">
            <div class="row text-bg-primary">
                <div class="col-1">
                    Id Cliente
                </div>
                <div class="col">
                    Nombre
                </div>
                <div class="col-3">
                    Rfc
                </div>
                <div class="col-3">
                    Curp
                </div>
            </div>
            @if (!dataViewed.length) {
            <div class="row">
                <div class="col border-bottom p-3">
                    No hay coincidencias.
                </div>
                @if (isLoading) {
                <div class="col-auto border-bottom p-3">
                    <div class="spinner-border spinner-border-sm text-secondary" role="status">
                        <span class="visually-hidden"></span>
                    </div>
                </div>
                }
            </div>
            }
            @for (option of dataViewed; track option.cliente_id) {
            <div class="row border-bottom pointer scale-0125 text-uppercase" [hidden]="option.hidden"
                (click)="onOptionSelected(option)">
                <div class="col-1 p-3">
                    {{option.cliente_id}}
                </div>
                <div class="col p-3">
                    {{utils.nombreClienteFromDatosPersonales(option)}}
                </div>
                <div class="col-3 p-3">
                    {{option.rfc}}
                </div>
                <div class="col-3 p-3">
                    {{option.curp}}
                </div>
            </div>
            }
        </div>
    </div>
</div>
}
