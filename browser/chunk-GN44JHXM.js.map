<!-- Datos Generales Moral -->
<app-generic-form [form]="formPM" [controller]="controller" [(edit)]="datoPersonaMoral"
  submitText="Guardar Datos Generales">
</app-generic-form>
<!-- Representante legal -->
@if(datoPersonaMoral){
  <div class="d-flex justify-content-between">
    <h5 class="mb-1 fw-bold">Busca un registro de datos personales:</h5>
    <button class="btn btn-success" (click)="limpiar()">Limpiar</button>
  </div>
<div class="p-3 mb-2">
  <app-buscador-datos-personales [(datoPersonal)]="representanteLegal" (datoPersonalChange)="updateDatosPersonaMoral($event)"
    [(datoPersonalId)]="datoPersonaMoral.representante_legal_id"></app-buscador-datos-personales>
</div>
<app-generic-form #genericFormRl [form]="formRL" [isolatedForm]="true" [controller]="datoPersonalController" [(edit)]="representanteLegal"
  (editChange)="updateDatosPersonaMoral($event)" submitText="Guardar Representante Legal" [validator]="{required:true}">
</app-generic-form>
}
