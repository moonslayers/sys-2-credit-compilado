@if (credito) {
  <div class="container-fluid p-3 rounded shadow my-1 bg-white">
    <h3><b>Detalles del Crédito {{credito.id}}</b></h3>
    <ul class="nav nav-pills nav-fill">
      @for (section of sections; track section) {
        <li class="nav-item">
          <a class="nav-link" [class.active]="sectionShows[section]">{{section}}</a>
        </li>
      }
    </ul>
    @if (credito.datos_persona_fisica) {
      <data-view-section title="Datos Del Cliente" [data]="credito.datos_persona_fisica.datos_personales" />
      <data-view-section title="Telefonos Del Cliente" [data]="credito.datos_persona_fisica.datos_personales?.telefonos_personales"/>
      <data-view-section title="Datos Del Negocio" [data]="credito.datos_persona_fisica.negocios" />
    }
    @if (credito.datos_personas_morales) {
      <data-view-section title="Datos Del Cliente" [data]="credito.datos_personas_morales" />
      <data-view-section title="Telefonos Del Cliente" [data]="credito.datos_personas_morales.telefonos" />
      <data-view-section title="Representante Legal" [data]="credito.datos_personas_morales.representante_legal" />
      <data-view-section title="Telefonos Del Representante Legal" [data]="credito.datos_personas_morales.representante_legal?.telefonos_personales" />
    }
    <data-view-section title="Datos Del Aval" [data]="credito.datos_personales" />
    <data-view-section title="Telefonos Del Aval" [data]="credito.datos_personales?.telefonos_personales" />
  </div>
}
