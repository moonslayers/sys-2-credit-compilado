<div class="container-fluid p-3">
    <div class="container-fluid pb-3 rounded shadow bg-white">
        <app-tabla title="Liquidaciones anticipadas" [tableDefinition]="tabla" [getConditionals]="conditionals"
            [controller]="liquidacionAnticipadaController" [barraBusqueda]="false" [eliminar]="false" [restaurar]="false">
            <div class="py-3">
                <app-buscador-creditos [justId]="true" [(creditoId)]="credito_id"
                    (creditoIdChange)="aplicarFiltros()"></app-buscador-creditos>
            </div>
        </app-tabla>
    </div>
</div>
