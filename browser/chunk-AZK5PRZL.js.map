<div class="toast-wrapper">
  @for (toast of toastyService.toasts$ | async; track toast) {
    <app-toasty-notification
      [type]="toast.type"
      [message]="toast.message"
      [title]="toast.title"
      [id]="toast.id"
      [remove]="removeToast.bind(this)"
    ></app-toasty-notification>
  }
</div>
