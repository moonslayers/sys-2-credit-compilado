<div class="container-fluid p-3 my-1 rounded shadow bg-white">
  <h4>Transferencias Bancarias o Pagos no identificados</h4>
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 my-3 rounded border p-3 bg-light">
      <h5 class="mb-3 text-primary"><i class="bi bi-funnel me-2"></i>Filtros avanzados</h5>
      <div class="mb-3">
        <label class="form-label fw-semibold">Estado del pago</label>
        <select class="form-select" [(ngModel)]="filtros.estado">
          <option value="">Todos los pagos</option>
          <option value="aplicado">Aplicados</option>
          <option value="no_identificado">No identificados</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Referencia</label>
        <input type="text" class="form-control" placeholder="Buscar por referencia..."
          [(ngModel)]="filtros.referencia">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Monto</label>
        <div class="input-group">
          <span class="input-group-text">$</span>
          <input type="number" class="form-control" placeholder="0.00" [(ngModel)]="filtros.monto" step="0.01"
            min="0">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Estado Crédito</label>
        <div class="input-group">
          <span class="input-group-text">Estado</span>
          <input type="text" class="form-control" placeholder="Ingresa algo para filtrar..." [(ngModel)]="filtros.estado_credito">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Rango de fechas</label>
        <div class="row g-2">
          <div class="col-md-6">
            <label class="small text-muted">Desde</label>
            <input type="date" class="form-control" [(ngModel)]="filtros.desde">
          </div>
          <div class="col-md-6">
            <label class="small text-muted">Hasta</label>
            <input type="date" class="form-control" [(ngModel)]="filtros.hasta">
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-between mt-4">
        <button class="btn btn-outline-secondary" (click)="limpiarFiltros()">
          <i class="bi bi-eraser me-1"></i> Limpiar
        </button>
        <button class="btn btn-primary" (click)="aplicarFiltros()">
          <i class="bi bi-check-circle me-1"></i> Aplicar filtros
        </button>
      </div>
    </div>
  </div>
  @if (mostrarTabla) {
    <app-tabla [controller]="cargaMasivaController" [barraBusqueda]="false"
      [showBarraButtons]="false" [checkbox]="false" [tableDefinition]="tabla" [useDefaultRowEditRedirect]="false"
      [relations]="relations" (rowEditarClick)="editarPago($event)" [getExtra]="getExtra" [rowEliminar]="false"
      [getConditionals]="getConditionals">
    </app-tabla>
  }
</div>
<app-formulario-flotante [(show)]="showEdit" size="large">
  @if (showEdit) {
    <app-editar-carga-masiva [cargaMasivaEdit]="cargaMasivaEdit"
      (cargaMasivaEditChange)="showEdit=false" />
  }
</app-formulario-flotante>
