<app-formulario-flotante [(show)]="show" (showChange)="showChange.emit($event)">
  <app-generic-form
    [controller]="controller"
    [form]="form"
    [isolatedForm]="true"
    [conditionals]="formConditionals"
    [(edit)]="datoFiscal"
    (editChange)="datoFiscalChange.emit($event)"
    rowButtonClass="row py-3 bg-white sticky-bottom z-2"
    [validator]="{ required: true }"
    ></app-generic-form>
</app-formulario-flotante>
