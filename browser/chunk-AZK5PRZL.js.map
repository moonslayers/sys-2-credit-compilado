<div class="upper-menu">
  <div class="left-side">
    <h2>FACTURACI&Oacute;N v1.2</h2>
    <!-- <app-filtered-search (filtersSubmitted)="onFiltersChanged($event)"></app-filtered-search> -->
  </div>

  <nav class="nav-menu">
    <app-sub-menu-active-button
      [label]="titleSubMenu"
      [svgIcon]="pagosIcon"
      (click)="cambiarTipoFacturacion()"
    >
    </app-sub-menu-active-button>
  </nav>
</div>

<app-toasty-container></app-toasty-container>

<!-- Facturar el Interés de los abonos -->
@if (typeFacturacion === "pagos") {
  <app-table-facturacion [filters]="activeFilters"> </app-table-facturacion>
}
<!-- ./Facturar el Interés de los abonos -->

<!-- Facturar Comisión por Apertura -->
@if (typeFacturacion === "comision") {
  <app-table-fac-comision> </app-table-fac-comision>
}
<!-- ./Facturar Comisión por Apertura -->
