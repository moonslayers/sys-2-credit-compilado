<div class="container-xxl text-center p-3">
  <!-- Breadcrumb -->
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb bg-transparent mb-3">
      <li class="breadcrumb-item text-primary p-0">
        Fondos BC
      </li>
      <li class="breadcrumb-item active text-dark" aria-current="page">
        Estados de cuenta
      </li>
    </ol>
  </nav>
  @if (credito) {
    <div class="row justify-content-end sticky-top">
      <div class="col-auto p-3">
        <button class="btn btn-sm btn-success rounded-pill" (click)="estadoCuentePdf.generarEstadoCuentaFromCreditoID(credito)">
          <i class="bi bi-printer-fill"></i>
        </button>
      </div>
      <div class="col-auto p-3">
        <button class="btn btn-sm btn-outline-primary rounded-pill" (click)="credito=undefined">
          <i class="bi bi-chevron-left"></i>
        </button>
      </div>
    </div>
  }
  @if (!credito) {
    <app-cliente-creditos (creditoSelected)="onCreditoSelected($event)"/>
  }
  @if (credito) {
    <app-resumen-estado-cuenta-cliente [credito]="credito"></app-resumen-estado-cuenta-cliente>
  }
</div>
