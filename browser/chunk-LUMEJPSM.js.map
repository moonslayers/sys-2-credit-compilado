<div class="container-xxl text-center p-3">

  <!-- Breadcrumb -->
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb bg-transparent mb-3">
      <li class="breadcrumb-item text-primary p-0">
        Fondos BC
      </li>
      <li class="breadcrumb-item active text-dark" aria-current="page">
        Inicio
      </li>
    </ol>
  </nav>

  <!-- Header del dashboard -->
  <app-header
    [credito]="ultimoCreditoActivo"
  ></app-header>

  <div class="row justify-content-between">

    <!-- Abonos realizados para el credito -->
    <div class="col-12 col-md-6 py-3">
      <app-abonos-realizados
        [credito]="ultimoCreditoActivo"
      ></app-abonos-realizados>
    </div>

    <!-- Datos del proximo pago -->
    <div class="col-12 col-md-6 py-3">
      <app-proximo-pago
        [credito]="ultimoCreditoActivo"
      ></app-proximo-pago>
    </div>
  </div>

  <!-- Periodos hasta el primer periodo vigente -->
  <app-pagos-pendientes
    [credito]="ultimoCreditoActivo"
  ></app-pagos-pendientes>

</div>
