
<div class="abonos-container shadow-sm rounded animate__animated animate__fadeInRight">
  <div class="py-3 px-4 bg-light rounded-top text-center border-bottom">
    <div class="d-flex flex-row align-items-center justify-content-between">
      <div class="px-4 text-start">
        <h2 class="h5 mb-0 text-primary fw-semibold">
          <i class="bi bi-file-person me-2"></i>Editar datos del negocio
        </h2>
        <p class="small mb-0">Cambia tus datos fiscales para tus creditos.</p>
      </div>
    </div>
  </div>
  <div class=" p-3 bg-white">
    <app-generic-form
      [(form)]="form"
      [isolatedForm]="true"
      (valuesChange)="checkValues($event)"
      [conditionals]="formConditionals"
      [controller]="negocioController"
      [(edit)]="negocio"
      (editChange)="updateDatoPersonaFisica()"
      [validator]="formValidator"
      rowButtonClass="row pt-3 pb-0 bg-white sticky-bottom z-2"
    ></app-generic-form>
  </div>
</div>
