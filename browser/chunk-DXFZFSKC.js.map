<div class="configuraciones-tablas-preview">
  @if (tablasPreparadas.length === 0) {
    <!-- Si no hay configuraciones, mostrar alerta informativa -->
    <div class="alert alert-info">
      <i class="bi bi-info-circle me-2"></i>
      <strong>{{ getNombreSeccion() }}</strong> - Sin configuraciones guardadas
      <p class="mb-0 mt-2">No hay tablas configuradas para esta sección. Configure las tablas en el módulo de configuración histórica.</p>
    </div>
  } @else {
    <!-- Mostrar cada configuración de tabla -->
    @for (config of tablasPreparadas; track config.id) {
      <div class="mb-4">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-0">
            <app-informe-tabla-configurada
              [tablaConfigurada]="config.configuracion"
              [data]="rawData">
            </app-informe-tabla-configurada>
          </div>
        </div>
      </div>
    }
  }
</div>
