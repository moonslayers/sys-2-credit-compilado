<app-main-informe title="Informes Por Programa Por Ejercicio Fiscal"
    description="Consulte y genere informes organizados por período fiscal" iconClass="bi-graph-up">
    @for (reporte of reportes(); track $index) {
        <div class="mb-4">
            <h4 class="text-center fw-bold">Ejercicio Fiscal {{reporte['año']}}</h4>
        <app-tabla-por-programa-ejercicio-fiscal [reporte]="reporte"></app-tabla-por-programa-ejercicio-fiscal>
        </div>
    }
</app-main-informe>
