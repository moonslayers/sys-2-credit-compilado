<div class="abonos-container shadow-sm rounded animate__animated animate__fadeInRight">

  <div class="py-3 px-4 bg-light rounded-top text-center border-bottom">
    <div class="d-flex flex-row align-items-center justify-content-between">
      <div class="px-4 text-start">
        <h2 class="h5 mb-0 text-primary fw-semibold">
          <i class="bi bi-lock me-2"></i>Cambiar Contraseña
        </h2>
        <p class="small mb-0">Cambia la contraseña de tu cuenta del portal de beneficiarios de Fondos BC.</p>
      </div>
      <button
        class="btn btn btn-secondary shadow text-bold scale-05"
        [disabled]="!isFormValid()" (click)="updatePass()">
          Guardar
      </button>
    </div>
  </div>

  <!-- Inputs con el contenido de la carta -->
  <div class="p-3 bg-white" style="max-height: 250px; overflow: auto;">
    <div class="input-group my-3">
        <span class="input-group-text" id="basic-addon1">Contraseña anterior (si no hay, dejar en blanco):</span>
        <input type="password" class="form-control" placeholder="contraseña" aria-label="contraseña" aria-describedby="basic-addon1" [(ngModel)]="oldPass">
    </div>
    <div class="input-group mb-3">
        <span class="input-group-text" id="basic-addon1">Contraseña nueva:</span>
        <input type="password" class="form-control" placeholder="contraseña" aria-label="contraseña" aria-describedby="basic-addon1" [(ngModel)]="newPass">
    </div>
    <div class="input-group mb-3">
        <span class="input-group-text" id="basic-addon1">Confirmar contraseña nueva:</span>
        <input type="password" type="text" class="form-control" placeholder="contraseña" aria-label="contraseña" aria-describedby="basic-addon1" [(ngModel)]="confirmPass">
    </div>
  </div>

  <!-- Pie de tabla -->
  <div class="py-2 px-4 bg-light rounded-bottom border-top">
    <div class="d-flex justify-content-between align-items-center">
      <span class="text-muted small">
        La fecha de este periodo es del
      </span>
    </div>
  </div>

</div>
