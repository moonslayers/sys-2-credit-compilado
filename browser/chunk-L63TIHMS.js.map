<div class="row py-1 border-bottom">
  <div class="col-12 col-sm p-1 px-3">
    @if (!edit) {
      <span>
        {{detalle.nombre}}
      </span>
    }
    @if (edit) {
      <input
        type="text"
        placeholder="Detalle..."
        class="form-control"
        [(ngModel)]="detalle.nombre">
    }
  </div>
  <div class="col-12 col-sm p-1 px-3">
    @if (!edit) {
      <span>
        {{detalle.monto_solicitado | currency}}
      </span>
    }
    @if (edit) {
      <input
        type="number"
        class="form-control"
        placeholder="Monto...$"
        [(ngModel)]="detalle.monto_solicitado">
    }
  </div>
  <div class="col-12 col-sm text-nowrap text-end p-1 px-3">
    @if (edit) {
      <button class="btn btn-sm btn-primary" (click)="saveDetalle()">
        @if (isLoading) {
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        }
        @if (!isLoading) {
          <i class="bi bi-floppy-fill"></i>
        }
      </button>
    }
    @if (!edit) {
      <button class="btn btn-sm btn-primary mx-1" (click)="edit=true" [disabled]="isFormalizado">
        <i class="bi bi-pencil-fill"></i>
      </button>
    }
    <button class="btn btn-sm btn-danger mx-1" (click)="deleteDetalle()" [disabled]="isFormalizado">
      <i class="bi bi-trash-fill"></i>
    </button>
  </div>
</div>
