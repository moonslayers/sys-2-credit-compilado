<div class="container p-3">
  <!-- <h5 class="fw-bold">Datos Fiscales</h5> -->
  <!-- <hr class="my-1 border border-primary"> -->
  <app-generic-form
    [controller]="controller"
    [form]="form"
    [isolatedForm]="true"
    [(edit)]="datosFiscales"
    rowButtonClass="row py-3 bg-white sticky-bottom z-2"
    [disabled]="creditoFormUtils.isFormDisabled(credito)"
    >
  </app-generic-form>
</div>
@if (!datosPersonales) {
  <div class="container">
    <div class="alert alert-warning" role="alert">
      No haz ingresado los datos del negocio, llena primero los datos del negocio y despues llena los datos fiscales
    </div>
  </div>
}
