<app-generic-form 
[(form)]="form"
[isolatedForm]="true"
(valuesChange)="checkValues($event)"
[conditionals]="formConditionals"
[controller]="negocioController"
[(edit)]="negocio"
(editChange)="updateDatoPersonaFisica()"
[validator]="formValidator"
[disabled]="creditoFormUtils.isFormDisabled(credito)"
rowButtonClass="row pt-3 pb-0 bg-white sticky-bottom z-2" 
/>
