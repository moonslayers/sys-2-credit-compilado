<app-formulario-flotante [(show)]="show" (showChange)="showChange.emit($event)">
    <div class="container-fluid px-4 pt-0 pb-4">
        <h4><b>Condonar Moratorios</b></h4>
        <div class="input-group mt-2">
            <label class="input-group-text">Monto</label>
            <input [(ngModel)]="condonacion.monto" class="form-control" type="number" placeholder="Ingrese una cantidad $...">
        </div>
        <div class="input-group mt-2">
            <label class="input-group-text">Motivo</label>
            <input [(ngModel)]="condonacion.motivo" class="form-control" placeholder="Ingrese un motivo valido...">
        </div>
        <div class="input-group mt-2">
            <label class="input-group-text">¿Aplica en pagos de juridico?</label>
            <select [(ngModel)]="condonacion.descuento_pagos_juridico" class="form-select">
                <option>NO</option>
                <option>SI</option>
            </select>
        </div>
        <div class="row px-3 mt-4">
            <button class="btn btn-primary" (click)="submit()" [disabled]="condonacion.monto!==null || !condonacion.motivo">Guardar</button>
        </div>
    </div>
</app-formulario-flotante>
