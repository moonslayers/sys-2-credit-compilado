<div class="credit-request-container p-4 rounded-4 shadow-sm bg-white">
    <!-- Encabezado -->
    <div class="form-header mb-4 text-center">
      <h2 class="h3 text-primary fw-bold mb-2">
        <i class="bi bi-cash-stack me-2"></i>Solicitar Nuevo Crédito
      </h2>
      <p class="text-muted">Complete los siguientes campos para iniciar su solicitud</p>
    </div>

    <!-- Formulario -->
      <!-- Campo Sucursal -->
      <div class="form-section mb-4">
        <label for="sucursal" class="form-label fw-semibold">
          <i class="bi bi-geo-alt-fill me-2 text-primary"></i>Sucursal preferida
        </label>
        <div class="input-group">
          <span class="input-group-text bg-light">
            <i class="bi bi-search text-muted"></i>
          </span>
          <app-autocomplete-field
          apiUrl="api/sucursales"
          keyList="id"
          keyDetalle="nombre"
          [inputGroup]="true"
          [extraData]="extraDataSucursales"
          [(value)]="credito.sucursal_id"
          />
        </div>
        <div class="form-text text-muted mt-1">
          Seleccione la sucursal donde desea realizar el trámite
        </div>
      </div>

      <!-- Campo Programa -->
      <div class="form-section mb-4">
        <label for="programa" class="form-label fw-semibold">
          <i class="bi bi-card-list me-2 text-primary"></i>Programa de financiamiento
        </label>
        <app-autocomplete-field
        apiUrl="api/productos_financieros"
        keyList="id"
        keyDetalle="alias"
        [extraData]="extraData"
        [(value)]="credito.productos_financiero_id"
        />
        <div class="form-text text-muted mt-1">
          Elija el tipo de crédito que necesita
        </div>
      </div>

      <!-- Información Adicional -->
      <div class="info-card p-3 mb-4 rounded-3 bg-light border-start border-4 border-primary">
        <div class="d-flex">
          <i class="bi bi-info-circle-fill text-primary me-3 fs-5"></i>
          <div>
            <h6 class="fw-bold mb-1">¿Necesita ayuda?</h6>
            <p class="small mb-0">Nuestros asesores están disponibles para orientarle en el proceso de solicitud.</p>
          </div>
        </div>
      </div>

      <!-- Accioness -->
      <div class="form-actions d-flex justify-content-between pt-3">
        <button
          class="btn btn-outline-secondary rounded-pill px-4"
          (click)="cancelarCreacionCredito()">
          <i class="bi bi-arrow-left me-2"></i>Cancelar
        </button>
        <button
          (click)="onSubmit()"
          class="btn btn-primary rounded-pill px-4">
          Continuar
          <i class="bi bi-arrow-right ms-2"></i>
        </button>
      </div>
  </div>
