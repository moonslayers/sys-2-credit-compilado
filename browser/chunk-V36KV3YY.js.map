<app-formulario-flotante [(show)]="show" (showChange)="showChange.emit($event)">
    <h4 class="text-center mb-3">Nuevo Credito</h4>
    <div class="row justify-content-evenly">
        <div class="col-12 col-sm p-3">
            <app-select-field
            label="Sucursal"
            [(value)]="edit.sucursal_id"
            [options]="sucursales"
            [validator]="{disabled:true}"
            >
            </app-select-field>
        </div>
        <div class="col-12 col-sm p-3">
            <app-autocomplete-field
            label="Producto Financiero"
            apiUrl="api/productos_financieros"
            keyList="id"
            keyDetalle="alias"
            [extraData]="extraData"
            [(value)]="edit.productos_financiero_id"
            />
        </div>
        <div class="row my-3">
            <div class="col text-center">
                <button class="btn btn-primary" (click)="onSubmit()" [disabled]="">
                    Guardar
                </button>
            </div>
        </div>
    </div>
</app-formulario-flotante>
