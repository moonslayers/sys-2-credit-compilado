<app-formulario-flotante size="small" [(show)]="show" (showChange)="showChange.emit($event)">
  <div class="container px-3 pb-3">
    <h5 class="mb-2"><b>{{title()}} crédito</b></h5>
    @if (!accion && credito) {
      <label>Estado:</label>
      <select class="form-select" [(ngModel)]="credito.estado">
        <option >ACTIVO</option>
        <option >RECHAZADO</option>
        <option >FINALIZADO</option>
        <option >CANCELADO</option>
      </select>
    }
    <label class="mt-2">Razón del cambio:</label>
    <textarea class="form-control" rows="4" [(ngModel)]="comentarios"></textarea>
    @if (credito) {
      <div class="row mt-3 px-3" >
        <button class="btn btn-success" (click)="submit()" [disabled]="!comentarios">
          Confirmar
        </button>
      </div>
    }
  </div>
</app-formulario-flotante>
