<div class="container p-3">
  <h5 class="my-2 fw-bold">Nuevo requerimiento de documento de credito</h5>
  <div class="row mt-2">
    <div class="col p-3">
      <label class="fw-bold">Documento requerido</label>
      <select class="form-control form-select" [(ngModel)]="documentoSelected">
        <option [value]="0" disabled>Selecciona un documento</option>
        @for (documento of productoFinancieroDocumentos; track documento) {
          <option [value]="documento.id">
            {{documento.documento?.nombre}}
          </option>
        }
      </select>
    </div>
  </div>
  <div class="row justify-content-center">
    <div class="col-auto p-3">
      <button class="btn btn-primary" (click)="nuevoDocumento()">
        Guardar
      </button>
    </div>
  </div>
</div>
