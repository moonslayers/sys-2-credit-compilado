<div class="row g-3 align-items-end mb-4">
    <div class="col-md-3">
        <label for="fechaInicio" class="form-label small fw-medium text-primary">Fecha Inicio</label>
        <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i
                    class="bi bi-calendar-event text-primary"></i></span>
            <input type="date" class="form-control border-start-0" id="fechaInicio" [(ngModel)]="filtros.fecha_inicio"
                [max]="filtros.fecha_fin">
        </div>
    </div>
    <div class="col-md-3">
        <label for="fechaFin" class="form-label small fw-medium text-primary">Fecha Fin</label>
        <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i
                    class="bi bi-calendar-event text-primary"></i></span>
            <input type="date" class="form-control border-start-0" id="fechaFin" [(ngModel)]="filtros.fecha_fin"
                [min]="filtros.fecha_inicio">
        </div>
    </div>
    <div class="col-md-6 d-flex gap-3 justify-content-end">
        @if(!isLoading){
        <button class="btn btn-success d-flex align-items-center fw-medium" [disabled]="isLoading"
            (click)="downloadExcel.emit()">
            <i class="bi bi-file-earmark-excel"></i>
        </button>
        }
        <button class="btn btn-success d-flex align-items-center py-2 px-4 fw-medium" [disabled]="isLoading"
            (click)="download.emit()">
            <i class="bi bi-cloud-download me-2"></i>
            Generar Informe
            @if (isLoading) {
            <span class="ms-2 spinner-border spinner-border-sm"></span>
            }
        </button>
    </div>
</div>
