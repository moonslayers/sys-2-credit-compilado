<div class="container rounded shadow bg-white my-1 p-3">
    <h3>Migrar Gestiones desde Viejo Sistema</h3>
    <div class="input-group mt-2">
        <label class="input-group-text">PHP SESION</label>
        <input type="text" class="form-control" placeholder="PHPIDSESION... o cookie" [(ngModel)]="phptoken">
        <label class="input-group-text">Primer Credito:</label>
        <input type="number" class="form-control" placeholder="id credito..." [(ngModel)]="creditoInicio">
        <label class="input-group-text">Ultimo credito:</label>
        <input type="number" class="form-control" placeholder="id credito..." [(ngModel)]="creditoFin">
        <label class="input-group-text">Chunk:</label>
        <input type="number" class="form-control" placeholder="Chunk." [(ngModel)]="chunkSize">
        <button class="btn btn-primary" (click)="migrarCredito()">Iniciar</button>

    </div>
</div>
