<div class="container-fluid p-3 my-1 rounded bg-white shadow">
    <h4>Actualizacion masiva de estados de cuenta al día</h4>
    @if (!creditos.length) {
    <app-progress-bar-consolidado title="Descargando datos de creditos" [progress]="progress"
        [isLoading]="true"></app-progress-bar-consolidado>
    }

    @if (creditos.length) {
    <button class="btn btn-primary" (click)="actualizarEstadosDeCuenta()">Actualizar estados de cuenta</button>
    }
</div>
