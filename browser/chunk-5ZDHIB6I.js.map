<div class="container p-3 rounded shadow my-2">
    <h4>Funciones de utilería</h4>
    <div class="input-group">
        <label for="" class="input-group-text">ID de Credito</label>
        <input class="form-control" type="text" [(ngModel)]="creditoId">
    </div>
    <div class="row mt-2">
        <div class="col-auto">
            <button class="btn btn-secondary" (click)="refrescarReferenciaBancaria()">
                Refrescar Referencia Bancaria
            </button>
        </div>
    </div>
</div>
