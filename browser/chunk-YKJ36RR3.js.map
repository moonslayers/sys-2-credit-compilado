@if (credito) {
  <div class="container p-3">
    <h5 class="fw-bold">Datos bancarios del solicitante</h5>
    <hr class="my-1 border border-primary">
    <div class="row justify-content-evenly mt-2">
      <div class="col-12 col-sm p-3">
        <label><b>Banco</b></label>
        <input class="form-control" placeholder="Nombre del banco..." [(ngModel)]="credito.banco"
          (input)="filterBancos()" #bancoInput [disabled]="isFormalizado">
        <!-- Lista de sugerencias -->
        @if (filteredBancos.length > 0) {
          <div class="list-group mt-1">
            @for (banco of filteredBancos; track banco) {
              <button type="button" class="list-group-item list-group-item-action"
                (click)="selectBanco(banco)">
                {{banco}}
              </button>
            }
          </div>
        }
      </div>
      <div class="col-12 col-sm p-3">
        <label><b>Numero de cuenta bancaria</b></label>
        <input class="form-control" placeholder="Numero de cuenta..." [(ngModel)]="credito.numero_cuenta" [disabled]="isFormalizado">
      </div>
      <div class="col-12 col-sm p-3">
        <label><b>CLABE Interbancaria</b></label>
        <input class="form-control" placeholder="CLABE..." maxlength="18" [(ngModel)]="credito.clabe_interbancaria" [disabled]="isFormalizado">
      </div>
    </div>
    <div class="row px-5 mt-4">
      <div class="col text-center">
        <button class="btn btn-primary" (click)="creditoController.update(credito.id,credito)" [disabled]="isFormalizado">Guardar</button>
      </div>
    </div>
  </div>
}
