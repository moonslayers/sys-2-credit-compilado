<div class="row">
    <div class="col p-1">
        <h5 class="fw-bold">Despacho asignado</h5>
    </div>
    @if (edit?.id) {
    <div class="col-auto p-1">
        <button class="btn btn-danger" (click)="delete()"><i class="bi bi-trash"></i></button>
    </div>
    }
</div>
<hr class="border border-primary my-1">
<app-generic-form #genericForm     
    [controller]="creditoDespachoController" 
    [form]="form" 
    [isolatedForm]="true" 
    [(edit)]="edit"
    (editChange)="editChange.emit($event)" 
    [localForm]="localForm" 
    [formExtra]="{
        credito_id:credito?.id
        }">
</app-generic-form>
