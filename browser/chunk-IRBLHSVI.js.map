<h5>Bitácora de Eventos de Juzgado</h5>
@if (!cobros.length) {
  <div class="p-5 text-center">
    No hay Eventos de Cobro Registrados
  </div>
}
@if (cobros.length) {
  <div class="table-responsive">
    <table class="table">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Descripción</th>
          <th>Comentario</th>
          <th>Resultado</th>
        </tr>
      </thead>
      <tbody>
        @for (evento of cobros; track evento) {
          <tr>
            <td>{{evento.fecha|date:'dd/MM/yyyy'}}</td>
            <td>{{evento.modalidad}}</td>
            <td>{{evento.comentario}}</td>
            <td>{{evento.resultado}}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
