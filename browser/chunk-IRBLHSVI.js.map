<div class="container-fluid p-0">
  <h5 class="fw-bold">Proceso y Etapa Judicial</h5>
  <hr class="border border-primary">
  <div class="row mt-2">
    <h6 class="text-uppercase mb-3"><b>ETAPA ACTUAL - {{etapaActualNombre || "Sin asignar"}}</b></h6>
    <div class="col">
      <div class="form-floating">
        <select class="form-select" [(ngModel)]="procesoSelected" (ngModelChange)="onProcesoChange($event)">
          <option [value]="0" disabled>Selecciona una opción</option>
          @for (proceso of procesos; track proceso) {
            <option class="text-uppercase" [value]="proceso.id">{{proceso.nombre.toUpperCase()}}</option>
          }
        </select>
        <label for="floatingSelect">Proceso Judicial:</label>
      </div>
    </div>
    <div class="col">
      <div class="form-floating">
        <select class="form-select" [(ngModel)]="etapaSelected" (ngModelChange)="onEtapaChange()" [disabled]="!procesoSelected">
          <option [value]="0" disabled>Selecciona una opción</option>
          @for (etapa of etapas; track etapa) {
            <option class="text-uppercase" [value]="etapa.id">{{etapa.nombre.toUpperCase()}}</option>
          }
        </select>
        <label for="floatingSelect">Etapa Judicial Actual:</label>
      </div>
    </div>
  </div>  
  <div class="row mt-2">    
    <div class="col p-4">
      <div class="input-group">
        <label class="input-group-text">Fecha:</label>
        <input type="date" placeholder="Fecha" class="form-control" [(ngModel)]="fecha" [disabled]="!etapaSelected">
      </div>
    </div>
    <div class="col p-4">
      <app-file-input #fileInput apiUrl="api/files/etapa_judicial_documento/save" key="document" [formExtra]="{id: fileId}" [showSimpleDownload]="true" [url]="juridicoEtapaEdit?.documento_url" (urlChange)="onUrl($event)" [disabled]="!fileId" [showButton]="false"/>
    </div>
    <div class="col-auto p-2 align-self-center">
      <button class="btn btn-success" (click)="confirmarEtapa()" [disabled]="!etapaSelected">
        Confirmar
      </button>
    </div>
  </div>
</div>
