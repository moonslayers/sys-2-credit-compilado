<h5 class="fw-bold">Datos de Jurídico</h5>
<hr class="border border-primary">
@if (edit) {
<div class="row">
    <div class="col-auto ms-auto">
        <button class="btn btn-danger" (click)="deleteJuridico()">Eliminar</button>
    </div>
</div>
}
<app-generic-form 
    [form]="form"
    [(edit)]="edit"
    (editChange)="editChange.emit($event)"
    [localForm]="formLocal"
    [controller]="juridicoController"
    [formExtra]="{credito_id:credito_id??0}"
    (updatedData)="crearEventoJuridico($event)"
/>
