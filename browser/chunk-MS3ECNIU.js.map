<div class="container-fluid p-2">
  <div class="container-fluid p-3 rounded shadow">
    <div class="row">
      @if (!edit) {
        <div class="col">
          <b>{{ record.tipos_usuarios?.nombre }}</b> -
          {{ record.sucursales?.nombre }} -
          {{ record.permisos_usuarios?.length }} permisos
        </div>
      }
      @if (edit) {
        <div class="col">
          <app-autocomplete-field
            [(value)]="record.tipos_usuario_id"
            placeholder="Tipo de usuario..."
            apiUrl="api/tipos_usuarios"
            keyList="id"
            keyDetalle="nombre"
          />
        </div>
        <div class="col">
          <app-autocomplete-field
            [(value)]="record.sucursal_id"
            placeholder="Sucursal..."
            apiUrl="api/sucursales"
            keyList="id"
            keyDetalle="nombre"
          />
        </div>
      }
      <div class="col-auto">
        <record-form-buttons
          [(edit)]="edit"
          [isDeleting]="isDeleting"
          [isLoading]="isLoading"
          (onDeleteButtonClick)="delete()"
          (onSaveButtonClick)="save()"
        >
          @if (record.id) {
            <button
              class="btn btn-secondary mx-1"
              (click)="showPermisos = !showPermisos"
            >
              Permisos
            </button>
          }
        </record-form-buttons>
      </div>
    </div>
    @if (showPermisos) {
      <div class="container py-1">
        <div class="row">
          <div class="col py-2">
            <app-autocomplete-field
              apiUrl="api/permisos"
              keyList="id"
              keyDetalle="nombre"
              [extraData]="filtrosPermisos"
              placeholder="Busca un permiso..."
              [(value)]="idNuevoPermiso"
              (valueChange)="onPermisoSelected()"
            />
          </div>
          <div class="col-auto py-2">
            <button class="btn btn-secondary" (click)="agregarTodosPermisos()">
              Todos
            </button>
          </div>
        </div>
        <div class="row">
          @for (permiso of record.permisos_usuarios; track permiso) {
            <div class="col-auto p-1">
              <app-permiso-usuario
                [record]="permiso"
                (onDeleted)="onPermisoDeleted(permiso)"
              />
            </div>
          }
        </div>
      </div>
    }
  </div>
</div>
