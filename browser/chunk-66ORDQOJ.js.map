<div class="container-fluid p-3 my-1">
  <div class="row">
    <div class="col">
      @if (!edit) {
        <span class="text-uppercase fw-bold">{{record.nombre}}</span>
      }
      @if (edit) {
        <div class="form-floating">
          <input class="form-control" placeholder="Nombre de la Etapa" [(ngModel)]="record.nombre">
          <label for="floatingNombreInput">Nombre de la Etapa:</label>
        </div>
      }
    </div>
    <div class="col-auto align-self-center">
      <record-form-buttons [(edit)]="edit" [isDeleting]="isDeleting" [isLoading]="isLoading" (onSaveButtonClick)="save()"
        (onDeleteButtonClick)="delete()">
      </record-form-buttons>
    </div>
  </div>
</div>
