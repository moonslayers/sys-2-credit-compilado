<img src="../../../assets/main_logo.png" class="img-fluid mt-3 rounded" alt="...">
<h3 class="text-center text-primary mt-2"><b>Sistema Fondos BC (Acreditados)</b></h3>
<div class="row px-2 mt-3 pb-2">
    <div class="col-12 mb-3">
        <div class="form-floating has-validation">
            <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com"
            [(ngModel)]="email" #emailInput="ngModel" required email
            [class.is-invalid]="emailInput.touched && emailInput.invalid">
            <label for="floatingInput">Correo electronico</label>
            <div id="floatingInputFeedback" class="invalid-feedback text-primary fw-bold">
                Ingresa un correo electronico válido.
            </div>
        </div>
    </div>
    <div class="col-12">
        <div class="form-floating has-validation">
            <input type="password" class="form-control" id="floatingPassword" placeholder="Password"
            [(ngModel)]="password" #passwordInput="ngModel" required
            [class.is-invalid]="passwordInput.touched && passwordInput.invalid" (keyup.enter)="submit()">
            <label for="floatingPassword">Contraseña</label>
            <div id="floatingInputFeedback" class="invalid-feedback text-primary fw-bold">
                Ingresa una contraseña.
            </div>
        </div>
    </div>
    <div class="col-12 text-center mt-3">
        <button class="btn btn-primary" [disabled]="!(emailInput.valid && passwordInput.valid)" (click)="submit()">
            Ingresar
        </button>
    </div>
</div>
